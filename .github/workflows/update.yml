# Combines the repo.json of every plugin listed in sources.json into one repo.json,
# so a single custom repository URL in Dalamud installs all of them.
# Each plugin's release workflow starts this right after a release (needs the PLUGIN_LIST_TOKEN secret
# in the plugin repo). The schedule is only a backup: GitHub often runs scheduled jobs hours late.
# You can also press "Run workflow" on the Actions tab.
name: Update plugin list

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths:
      - sources.json
      - .github/workflows/update.yml

permissions:
  contents: write

# One run at a time, so runs started by several plugin releases at once don't push over each other.
concurrency:
  group: update-plugin-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge the plugin lists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          # Start from the newest commit, in case another run pushed while this one was waiting.
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          [ -f repo.json ] || echo '[]' > repo.json
          mkdir -p parts
          i=0
          jq -c '.[]' sources.json | while read -r src; do
            i=$((i+1))
            name=$(echo "$src" | jq -r '.InternalName')
            url=$(echo "$src" | jq -r '.Url')
            # raw.githubusercontent.com caches files for 5 minutes, so right after a release it can still
            # hand out the old repo.json. Read the file through the GitHub API instead, which is never stale.
            api=$(echo "$url" | sed -nE 's#^https://raw\.githubusercontent\.com/([^/]+)/([^/]+)/HEAD/(.+)$#https://api.github.com/repos/\1/\2/contents/\3#p')
            ok=false
            if [ -n "$api" ] && curl -fsSL --retry 3 --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" "$api" -o "parts/$i.json"; then
              ok=true
            elif curl -fsSL --retry 3 --retry-delay 5 "$url" -o "parts/$i.json"; then
              ok=true
            fi
            if $ok && jq -e 'type == "array"' "parts/$i.json" > /dev/null; then
              echo "Fetched $name"
            else
              # Couldn't fetch it right now: keep the entry we already had, so the plugin doesn't disappear.
              echo "::warning::Could not fetch $url, keeping the previous entry for $name"
              jq --arg n "$name" '[.[] | select(.InternalName == $n)]' repo.json > "parts/$i.json"
            fi
          done
          jq -s 'add | sort_by(.Name)' parts/*.json > repo.new.json
          if [ "$(jq length repo.new.json)" -gt 0 ]; then mv repo.new.json repo.json; fi
          rm -rf parts repo.new.json

      - name: Commit if anything changed
        shell: bash
        run: |
          if git diff --quiet repo.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add repo.json
          git commit -m "Update plugin list"
          git push
